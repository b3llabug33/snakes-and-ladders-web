<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snakes and Ladders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <h1>Snakes and Ladders</h1>

    <!-- mode select -->
    <div id="modeScreen" class="panel">
      <p>choose a game mode</p>
      <button id="pvpBtn">player vs player</button>
      <button id="pvbBtn">player vs bot</button>
    </div>

    <!-- game -->
    <div id="gameScreen" class="panel hidden">
      <div id="status">player 1's turn — press roll</div>

      <pre id="board"></pre>

      <div id="controls">
        <button id="rollBtn">roll</button>
        <button id="restartBtn" class="hidden">play again</button>
      </div>

      <p class="legend">p1/p2 = players, LN/HN = ladder bottom/top, SN/TN = snake head/tail</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
